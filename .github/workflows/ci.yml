name: Mnemis CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential \
             qt6-base-dev qt6-multimedia-dev qt6-declarative-dev \
             libmpv-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
             libtag1-dev libsqlite3-dev

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Test
      working-directory: build
      run: ctest --output-on-failure -C Release
